name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Le decimos a GitHub que todos los comandos se ejecuten dentro de tu subcarpeta
    defaults:
      run:
        working-directory: ./landing-r4t
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Construir el proyecto Astro
        run: npm run build
        
      - name: Subir la carpeta pública (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing-r4t/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4